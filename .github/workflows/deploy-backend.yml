name: Deploy Backend PHP to FTP

on:
  push:
    branches:
      - main
    paths:
      - 'public/api/**'

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Use Checkout
      uses: actions/checkout@v4

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/api/
        server-dir: /public_html/GolfTeam/api/
        # Excluir cualquier JSON que pudiera haber por error en la carpeta api, igual que hacías en el manual
        exclude: |
          **/*.json
          **/*.log
          users.json
